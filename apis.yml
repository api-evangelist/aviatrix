aid: aviatrix
name: Aviatrix
description: >-
  Aviatrix is a cloud network security company whose Cloud Native Security Fabric (CNSF)
  delivers zero-trust, workload-level network security and runtime protection across AWS,
  Azure, GCP, OCI, and hybrid/edge environments. The platform - built on the Aviatrix
  Controller, CoPilot, and gateways - provides the Distributed Cloud Firewall (DCF),
  east-west segmentation, egress control, intrusion prevention with TLS decryption, and
  AI-enhanced threat detection under a single multicloud policy framework. Aviatrix is
  automation-first: its official Terraform provider (4.8M+ downloads) and goaviatrix Go
  client drive the Controller REST API, and integrations exist for Splunk, SIEM, and
  Kubernetes. This profile was enriched from Aviatrix's public developer, docs, and Trust
  Center surfaces.
