entries:
  - version: 9.0.0
    date: '2026-05-12'
    breaking: true
    highlights:
      - Intrusion Prevention System (IPS) with TLS decryption.
      - Distributed Cloud Firewall (DCF) expanded to serverless resources and edge platforms; DCF transparency mode for existing AWS Transit Gateway environments.
      - Active Mesh 4.0 Phase 2 with enhanced multicloud resiliency; IPv6 expansion; Site-to-Cloud on horizontally scaled transit gateways; first-hop VRF for overlapping CIDRs.
      - Gateway drain/undrain during maintenance; unified upgrade planning with automated upgrade-path validation; image upgrade support for self-managed and Equinix Edge gateways.
      - New Dell R470 hardware for AEP Edge replacing end-of-support models.
    removals:
      - Removed legacy Site2Cloud telemetry fields.
      - Deprecated RRD database dependencies.
